<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XD App - 投資策略圖表</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 700; color: #f8fafc; }
    header span { font-size: 13px; color: #64748b; }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }

    textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #e2e8f0; font-size: 14px; resize: vertical; outline: none; font-family: inherit; }
    textarea:focus { border-color: #6366f1; }

    .ticker-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .ticker-input { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; color: #e2e8f0; font-size: 14px; width: 120px; outline: none; }
    .ticker-input:focus { border-color: #6366f1; }
    .add-btn { background: #1e3a5f; color: #60a5fa; border: 1px solid #1e40af; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
    .add-btn:hover { background: #1e40af; }

    .ticker-tag { display: flex; align-items: center; gap: 6px; background: #1e3a5f; border: 1px solid #1e40af; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: #93c5fd; }
    .ticker-tag button { background: none; border: none; color: #64748b; cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
    .ticker-tag button:hover { color: #f87171; }

    .btn { background: #6366f1; color: #fff; border: none; border-radius: 8px; padding: 11px 24px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #334155; cursor: not-allowed; }

    .status { margin-top: 10px; font-size: 13px; color: #64748b; min-height: 18px; }
    .status.error { color: #f87171; }

    .prices-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .price-item { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 16px; }
    .price-item .sym { font-size: 13px; font-weight: 700; color: #f1f5f9; }
    .price-item .val { font-size: 18px; font-weight: 700; color: #4ade80; margin-top: 2px; }

    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
    .chart-card h3 { font-size: 13px; font-weight: 600; color: #64748b; padding: 14px 16px 0; text-transform: uppercase; letter-spacing: 0.05em; }
    .chart-box { padding: 8px; }

    .trend-tabs { display: flex; gap: 4px; padding: 10px 16px 0; flex-wrap: wrap; }
    .tab { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: #0f172a; color: #64748b; border: 1px solid #334155; }
    .tab.active { background: #312e81; color: #a5b4fc; border-color: #4338ca; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint { font-size: 12px; color: #475569; margin-top: 8px; }
    .extracted-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .extracted-tag { background: #1a2e05; color: #a3e635; border: 1px solid #365314; border-radius: 999px; padding: 3px 10px; font-size: 12px; }

    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>XD App</h1>
    <span>投資策略圖表分析</span>
  </header>

  <div class="container">
    <div class="card">
      <h2>貼上 Gemini / NotebookLM 分析內容</h2>
      <textarea id="analysisText" rows="6" placeholder="將 Gemini Pro 或 NotebookLM 的分析文字貼在這裡，系統會自動識別股票代號...&#10;&#10;或直接在下方手動輸入股票代號。"></textarea>
      <p class="hint">支援格式：美股（AAPL）、台股（2330.TW）、港股（0700.HK）</p>

      <div style="margin-top:16px">
        <div style="font-size:13px;color:#94a3b8;margin-bottom:8px">手動新增股票代號：</div>
        <div class="ticker-row" id="tickerTags"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input type="text" class="ticker-input" id="tickerInput" placeholder="AAPL / 2330.TW" />
          <button class="add-btn" onclick="addTicker()">+ 新增</button>
        </div>
      </div>

      <button class="btn" id="analyzeBtn" onclick="runAnalysis()">生成圖表</button>
      <div class="status" id="status"></div>
    </div>

    <div id="resultsSection" style="display:none">
      <div class="prices-bar" id="pricesBar"></div>

      <div id="extractedInfo" style="margin-bottom:16px;display:none">
        <span style="font-size:12px;color:#64748b">自動識別到：</span>
        <div class="extracted-tags" id="extractedTags"></div>
      </div>

      <div class="charts-grid">
        <div class="chart-card" id="trendCard">
          <h3>股票走勢</h3>
          <div class="trend-tabs" id="trendTabs"></div>
          <div class="chart-box" id="trendChart"></div>
        </div>
        <div class="chart-card">
          <h3>投資組合配置</h3>
          <div class="chart-box" id="portfolioChart"></div>
        </div>
        <div class="chart-card">
          <h3>風險報酬分析</h3>
          <div class="chart-box" id="riskChart"></div>
        </div>
        <div class="chart-card" id="comparisonCard">
          <h3>相對表現比較</h3>
          <div class="chart-box" id="comparisonChart"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let tickers = [];
    let chartsData = {};
    let activeTicker = null;

    document.getElementById('tickerInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTicker();
    });

    function addTicker() {
      const input = document.getElementById('tickerInput');
      const val = input.value.trim().toUpperCase();
      if (!val || tickers.includes(val)) { input.value = ''; return; }
      tickers.push(val);
      input.value = '';
      renderTags();
    }

    function removeTicker(t) {
      tickers = tickers.filter(x => x !== t);
      renderTags();
    }

    function renderTags() {
      document.getElementById('tickerTags').innerHTML = tickers.map(t =>
        `<div class="ticker-tag">${t}<button onclick="removeTicker('${t}')">×</button></div>`
      ).join('');
    }

    async function runAnalysis() {
      const text = document.getElementById('analysisText').value.trim();
      if (!text && tickers.length === 0) {
        setStatus('請貼上分析文字或輸入股票代號', true);
        return;
      }
      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      setStatus('<span class="spinner"></span>正在抓取股票數據並生成圖表...');

      try {
        const res = await fetch('/api/analyze_text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, tickers })
        });
        const data = await res.json();
        if (data.error) { setStatus(data.error, true); btn.disabled = false; return; }

        chartsData = data.charts;
        renderResults(data);
        setStatus('');
      } catch(e) {
        setStatus('網路錯誤：' + e.message, true);
      }
      btn.disabled = false;
    }

    function renderResults(data) {
      document.getElementById('resultsSection').style.display = 'block';

      // Prices
      document.getElementById('pricesBar').innerHTML = data.tickers.map(t => {
        const p = data.prices[t];
        return `<div class="price-item"><div class="sym">${t}</div><div class="val">${p != null ? p.toLocaleString() : 'N/A'}</div></div>`;
      }).join('');

      // Auto-extracted tickers
      if (data.auto_extracted && data.auto_extracted.length > 0) {
        document.getElementById('extractedInfo').style.display = 'block';
        document.getElementById('extractedTags').innerHTML = data.auto_extracted.map(t =>
          `<span class="extracted-tag">${t}</span>`
        ).join('');
      }

      // Trend chart tabs
      const trendTickers = Object.keys(data.charts.trends || {});
      if (trendTickers.length > 0) {
        document.getElementById('trendTabs').innerHTML = trendTickers.map((t, i) =>
          `<div class="tab ${i===0?'active':''}" onclick="showTrend('${t}', this)">${t}</div>`
        ).join('');
        activeTicker = trendTickers[0];
        showTrend(activeTicker, document.querySelector('.tab'));
      }

      // Portfolio
      if (data.charts.portfolio) {
        Plotly.newPlot('portfolioChart', JSON.parse(data.charts.portfolio));
      }

      // Risk/Return
      if (data.charts.risk_return) {
        Plotly.newPlot('riskChart', JSON.parse(data.charts.risk_return));
      }

      // Comparison
      if (data.charts.comparison) {
        Plotly.newPlot('comparisonChart', JSON.parse(data.charts.comparison));
        document.getElementById('comparisonCard').style.display = 'block';
      } else {
        document.getElementById('comparisonCard').style.display = 'none';
      }
    }

    function showTrend(ticker, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      const fig = JSON.parse(chartsData.trends[ticker]);
      Plotly.newPlot('trendChart', fig);
    }

    function setStatus(msg, isError = false) {
      const s = document.getElementById('status');
      s.innerHTML = msg;
      s.className = 'status' + (isError ? ' error' : '');
    }
  </script>
</body>
</html>

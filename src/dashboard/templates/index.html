<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XD App - 投資策略分析儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 700; color: #f8fafc; }
    header span { font-size: 13px; color: #64748b; }

    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

    .input-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 28px; }
    .input-card h2 { font-size: 15px; font-weight: 600; color: #94a3b8; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
    .input-row { display: flex; gap: 10px; }
    .input-row input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 14px; outline: none; }
    .input-row input:focus { border-color: #6366f1; }
    .btn { background: #6366f1; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #334155; cursor: not-allowed; }

    .status { margin-top: 12px; font-size: 13px; color: #64748b; min-height: 18px; }
    .status.error { color: #f87171; }
    .status.success { color: #4ade80; }

    .result-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
    .result-card h3 { font-size: 16px; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
    .result-meta { font-size: 12px; color: #64748b; margin-bottom: 16px; }

    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tag { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .tag.bull { background: #14532d; color: #4ade80; }
    .tag.bear { background: #450a0a; color: #f87171; }
    .tag.neutral { background: #1e3a5f; color: #60a5fa; }
    .tag.stock { background: #2d1b69; color: #a78bfa; }
    .tag.crypto { background: #1a2e05; color: #a3e635; }
    .tag.etf { background: #431407; color: #fb923c; }

    .section { margin-bottom: 16px; }
    .section-title { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .section-body { font-size: 14px; color: #cbd5e1; line-height: 1.6; }

    .tickers-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .ticker-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
    .ticker-item .sym { font-weight: 700; color: #f1f5f9; }
    .ticker-item .sent { font-size: 11px; margin-top: 2px; }
    .sent.看多 { color: #4ade80; }
    .sent.看空 { color: #f87171; }
    .sent.中性 { color: #94a3b8; }

    .points-list { list-style: none; }
    .points-list li { padding: 4px 0; font-size: 14px; color: #cbd5e1; }
    .points-list li::before { content: "▸ "; color: #6366f1; }

    .risks-list { list-style: none; }
    .risks-list li { padding: 4px 0; font-size: 14px; color: #fbbf24; }
    .risks-list li::before { content: "⚠ "; }

    .disclaimer { font-size: 11px; color: #475569; margin-top: 12px; font-style: italic; }

    .empty { text-align: center; padding: 60px 20px; color: #475569; }
    .empty p { font-size: 15px; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>XD App</h1>
    <span>投資策略分析儀表板</span>
  </header>

  <div class="container">
    <div class="input-card">
      <h2>分析新影片</h2>
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="貼上 YouTube 影片網址..." />
        <button class="btn" id="analyzeBtn" onclick="analyzeVideo()">開始分析</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div id="newResult"></div>

    <div id="historySection"></div>
  </div>

  <script>
    const HISTORY = {{ analyses | tojson }};
    async function analyzeVideo() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      const btn = document.getElementById('analyzeBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.className = 'status';
      status.innerHTML = '<span class="spinner"></span>正在抓取影片逐字稿並分析，請稍候（約 30-60 秒）...';

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (data.error) {
          status.className = 'status error';
          status.textContent = '錯誤：' + data.error;
        } else {
          status.className = 'status success';
          status.textContent = data.cached ? '已載入快取結果' : '分析完成！';
          const title = data.title || url;
          document.getElementById('newResult').innerHTML = buildCard(title, '', data.result);
          document.getElementById('urlInput').value = '';
        }
      } catch (e) {
        status.className = 'status error';
        status.textContent = '網路錯誤：' + e.message;
      }
      btn.disabled = false;
    }

    // Render history on load
    (function() {
      const sec = document.getElementById('historySection');
      if (!HISTORY || HISTORY.length === 0) {
        sec.innerHTML = '<div class="empty"><p>尚無分析記錄，貼上 YouTube 網址開始分析</p></div>';
        return;
      }
      sec.innerHTML = HISTORY.map(a => buildCard(a.title, a.published_at, a.raw || {})).join('');
    })();

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') analyzeVideo();
    });

    function sentClass(s) {
      if (s === '看多') return 'bull';
      if (s === '看空') return 'bear';
      return 'neutral';
    }

    function typeClass(t) {
      if (!t) return 'stock';
      t = t.toLowerCase();
      if (t.includes('etf')) return 'etf';
      if (t.includes('加密') || t.includes('crypto') || t.includes('幣')) return 'crypto';
      return 'stock';
    }

    function buildCard(title, date, r) {
      const tickers = (r.tickers || []).map(tk => `
        <div class="ticker-item">
          <div class="sym">${tk.symbol}</div>
          <div class="sent ${tk.sentiment}">${tk.sentiment} · ${tk.type || ''}</div>
          <div style="font-size:11px;color:#64748b;margin-top:2px">${tk.reason || ''}</div>
        </div>`).join('');

      const keyPts = (r.key_points || []).map(p => `<li>${p}</li>`).join('');
      const risks = (r.risks || []).map(r => `<li>${r}</li>`).join('');

      return `
        <div class="result-card">
          <h3>${title}</h3>
          <div class="result-meta">${date} · 時間維度：${r.time_horizon || '-'} · 可信度：${r.confidence || '-'}</div>

          <div class="tags">
            <span class="tag ${sentClass(r.sentiment)}">${r.sentiment || '中性'}</span>
          </div>

          ${tickers ? `<div class="section"><div class="section-title">提及標的</div><div class="tickers-grid">${tickers}</div></div>` : ''}

          <div class="section">
            <div class="section-title">市場展望</div>
            <div class="section-body">${r.market_outlook || '-'}</div>
          </div>

          ${keyPts ? `<div class="section"><div class="section-title">重點摘要</div><ul class="points-list">${keyPts}</ul></div>` : ''}

          <div class="section">
            <div class="section-title">建議策略</div>
            <div class="section-body">${r.strategy || '-'}</div>
          </div>

          ${risks ? `<div class="section"><div class="section-title">風險提示</div><ul class="risks-list">${risks}</ul></div>` : ''}

          <div class="disclaimer">${r.disclaimer || ''}</div>
        </div>`;
    }
  </script>
</body>
</html>
